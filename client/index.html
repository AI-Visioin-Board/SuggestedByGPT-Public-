<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SuggestedByGPT - Your Business, Suggested by GPT</title>
    <meta name="description" content="Done-for-you AI SEO optimization. Get your business recommended by ChatGPT, Gemini, and Claude. We handle the technical work so AI suggests you first." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="SuggestedByGPT" />
    <link rel="canonical" href="https://suggestedbygpt.com/" />

    <!-- Favicon — replaces the default globe in Google search snippets and browser tabs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-192.png" />
    <meta name="theme-color" content="#D97B6A" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SuggestedByGPT" />
    <meta property="og:title" content="SuggestedByGPT — Get Your Business Recommended by ChatGPT" />
    <meta property="og:description" content="Done-for-you AI SEO. We make sure ChatGPT, Gemini, Claude, and Perplexity recommend your business when customers ask AI for help." />
    <meta property="og:url" content="https://suggestedbygpt.com/" />
    <meta property="og:image" content="https://suggestedbygpt.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Get Your Business Recommended by ChatGPT" />
    <meta name="twitter:description" content="Done-for-you AI SEO for local businesses. Free 60-second visibility scan at suggestedbygpt.com/start." />
    <meta name="twitter:image" content="https://suggestedbygpt.com/og-default.png" />

    <!-- Schema Markup — Organization + Service + WebSite + FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://suggestedbygpt.com/#organization",
          "name": "SuggestedByGPT",
          "alternateName": [
            "Suggested by GPT",
            "Suggested By GPT",
            "suggestedbygpt",
            "Suggested by ChatGPT"
          ],
          "url": "https://suggestedbygpt.com",
          "logo": "https://suggestedbygpt.com/logo.png",
          "description": "Done-for-you AI visibility optimization. We make local businesses get recommended by ChatGPT, Google Gemini, Perplexity, Claude, and other AI platforms.",
          "foundingDate": "2026-02-01",
          "areaServed": "United States",
          "sameAs": [
            "https://www.instagram.com/suggestedbygpt",
            "https://www.youtube.com/@Suggestedbygpt"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "url": "https://suggestedbygpt.com",
            "availableLanguage": "English"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://suggestedbygpt.com/#website",
          "name": "SuggestedByGPT",
          "url": "https://suggestedbygpt.com",
          "publisher": { "@id": "https://suggestedbygpt.com/#organization" },
          "description": "Get your business recommended by AI. Done-for-you AI SEO optimization for local businesses.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://suggestedbygpt.com/start?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Service",
          "@id": "https://suggestedbygpt.com/#service",
          "name": "AI Visibility Optimization",
          "provider": { "@id": "https://suggestedbygpt.com/#organization" },
          "serviceType": "AI SEO Optimization",
          "description": "Comprehensive AI visibility optimization including schema markup, AI crawler access, directory submissions, content optimization, Google Business Profile management, and review signal building. Available in Jumpstart ($99 one-time) and Dominator ($299 + $89/mo) packages.",
          "areaServed": "United States",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "AI Visibility Packages",
            "itemListElement": [
              {
                "@type": "Offer",
                "name": "AI Jumpstart",
                "description": "One-time AI visibility setup: schema markup, AI crawler optimization, 10 directory submissions, technical SEO fixes. Delivered in 5-7 business days.",
                "price": "99",
                "priceCurrency": "USD"
              },
              {
                "@type": "Offer",
                "name": "AI Dominator",
                "description": "Complete done-for-you AI visibility: everything in Jumpstart plus 30+ directories, backlink building, Google Business Profile optimization, monthly monitoring, content strategy, and ongoing optimization.",
                "price": "299",
                "priceCurrency": "USD"
              }
            ]
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://suggestedbygpt.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What exactly is AI visibility optimization?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AI visibility optimization is the process of making your business appear when people ask AI chatbots — like ChatGPT, Google Gemini, Perplexity, and others — for recommendations. When someone types \"best plumber near me\" or \"top-rated spas in Austin\" into an AI assistant, our service ensures your business is part of the answer. Think of it like SEO, but for the new wave of AI-powered search and discovery."
              }
            },
            {
              "@type": "Question",
              "name": "How long does it take to see results?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Timelines depend on the package you choose. With the Jumpstart package, most businesses begin appearing in AI recommendations within 3 to 5 business days. The Dominator package, which includes deeper optimization across more platforms and directories, typically takes 7 to 10 business days for full implementation. Many clients report seeing their first AI-referred customer within the first two weeks."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need any technical knowledge?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Not at all. We handle about 90% of the work for you. Once you provide your basic business information, our team gets to work right away. Along the way, we may ask for a couple of things — like access to your website back office so we can install optimizations, or a quick approval before we make any visible changes to your site. There is no learning curve and nothing technical for you to do."
              }
            },
            {
              "@type": "Question",
              "name": "Will this work for my type of business?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "If you run a local or service-based business, the answer is almost certainly yes. We have helped spas, law firms, plumbers, dentists, restaurants, salons, fitness studios, auto shops, real estate agents, and many more. Any business that serves customers in a specific area and could benefit from being recommended by AI assistants is a great fit for our service."
              }
            },
            {
              "@type": "Question",
              "name": "What's the difference between the three options?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The free AI Needs Assessment gives you a snapshot of how AI currently views your business — great for understanding where you stand. The Jumpstart package ($99 one-time) handles core AI visibility with 10 automated deliverables across the most popular platforms. The Dominator package ($299 + $89/mo for 2 months) goes further — it includes everything in Jumpstart plus hands-on optimization, competitive analysis, 9 guest articles on industry blogs, directory submissions, and 2 monthly progress check-ins."
              }
            },
            {
              "@type": "Question",
              "name": "How does the pricing work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The AI Jumpstart is a one-time fee of $99 with no recurring charges. The AI Dominator is $299 upfront plus $89/month for 2 months ($477 total) to cover the extended hands-on work over 8-10 weeks. There are no hidden costs and no long-term contracts. The free assessment is completely free with no credit card required."
              }
            },
            {
              "@type": "Question",
              "name": "What is the free AI Needs Assessment?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The free AI Needs Assessment is a no-obligation snapshot of how AI currently sees your business. We scan your website and check your presence across ChatGPT, Gemini, Perplexity, and Claude — then deliver a personalized PDF report with your AI visibility score (rated 0-100), what is working well, what needs improvement, and specific recommendations. No credit card required."
              }
            },
            {
              "@type": "Question",
              "name": "What are the guest articles in the Dominator package?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "As part of the AI Dominator package, we publish 9 guest articles on relevant industry blogs over 3 months (3 articles per month). Each article naturally mentions your business with a backlink to your website. This boosts your traditional SEO through high-quality backlinks and increases your AI visibility by creating more brand mentions across the web — both of which help AI models recommend your business more often."
              }
            }
          ]
        }
      ]
    }
    </script>
